name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mcp
      - run: npm test
      - run: npm run build
      # MCP server: local (Node) and Cloudflare Worker builds type-check
      - run: npx --prefix mcp tsc --noEmit -p mcp
      - run: npx --prefix mcp tsc --noEmit -p mcp/tsconfig.worker.json
