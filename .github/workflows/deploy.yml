name: GitHub Pages redirect

# The app is hosted on Cloudflare Pages (https://omegaplanner.pages.dev), which builds every push.
# The old GitHub Pages address only serves a redirect there, plus a service worker that removes
# the old installed app's offline cache.
on:
  push:
    branches: [main]
    paths: ['gh-pages-redirect/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deep links like /OmegaPlanner/calendar land on 404.html, so it redirects too.
      - run: cp gh-pages-redirect/index.html gh-pages-redirect/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
